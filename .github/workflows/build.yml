name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # use the SDK version from mod.json
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}
          # r30+ libc++ needs std::__hash_memory, which Geode's libc++_shared.so lacks
          android-ndk-version: 29.0.14206865

  package:
    # merge the per-platform builds into one .geode
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: lazer-ui
          path: ${{ steps.build.outputs.build-output }}/*.geode

  release:
    # Publishes the CI build as a GitHub release when a v* tag is pushed, or when
    # main's mod.json has a version with no release yet. Installed copies of the
    # mod read main's mod.json and download that release (src/update/Updater.cpp),
    # so bumping the version on main is how an update ships.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    name: Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(jq -r .version mod.json)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is already released, nothing to do"
          else
            echo "name=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from changelog.md
        if: steps.tag.outputs.name != ''
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # The "## <tag>" section, up to the next "## " heading.
          awk -v tag="## $TAG" '{sub(/\r$/, "")} $0 == tag {keep=1; next} /^## / {keep=0} keep' changelog.md > notes.md
          {
            echo
            echo "---"
            echo "Built by GitHub Actions from $GITHUB_SHA."
            echo "Not on the Geode index: install manually, at your own risk. Once installed, Lazer UI"
            echo "offers new versions itself (Lazer settings > Updates)."
          } >> notes.md

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.name != ''
        with:
          name: lazer-ui
          path: out

      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.name != ''
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: out/*.geode
          prerelease: true
          body_path: notes.md
