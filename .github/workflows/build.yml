name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          # use the SDK version from mod.json
          sdk: given

      - uses: actions/upload-artifact@v4
        with:
          name: lazer-ui
          path: ${{ steps.build.outputs.build-output }}/*.geode

  release:
    # tagged pushes (e.g. v0.1.1) publish the CI build as a GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lazer-ui
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.geode
          prerelease: true
          body: |
            Built by GitHub Actions from ${{ github.sha }}.
            Not on the Geode index: install manually, at your own risk.
